<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Turbo</title>
    <script src="/dist/turbo.es2017-umd.js" data-turbo-track="reload"></script>
    <script src="/src/tests/fixtures/test.js"></script>
    <script>
      (function() {
        let paragraph = null
        let observer = null

        function connect() {
          const container = document.getElementById("component-container")
          if (!container || paragraph) return

          paragraph = document.createElement("p")
          paragraph.id = "component-output"
          paragraph.textContent = "Hello from component"
          container.appendChild(paragraph)

          observer = new MutationObserver(() => {
            if (!container.isConnected) disconnect()
          })
          observer.observe(document.documentElement, { childList: true, subtree: true })
        }

        function disconnect() {
          if (paragraph) {
            paragraph.remove()
            paragraph = null
          }
          if (observer) {
            observer.disconnect()
            observer = null
          }
        }

        addEventListener("turbo:load", connect)
      })()
    </script>
  </head>
  <body id="cache-racing-source">
    <h1>Original page</h1>
    <input id="client-state" value="Server value">
    <div id="component-container"></div>
    <p><a id="link-to-page-with-different-head" href="/src/tests/fixtures/cache_racing_target.html">Page with different head</a></p>
  </body>
</html>
