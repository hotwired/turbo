<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Native form history</title>
    $TURBO_SCRIPT
    <script src="/src/tests/fixtures/test.js"></script>
  </head>
  <body>
    <h1>Native form history</h1>
    <p>Request method: <output id="request-method">$REQUEST_METHOD</output></p>

    </form>
  </body>
</html>
